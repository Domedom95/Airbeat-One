<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Airbeat One">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Airbeat One</title>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">AIRBEAT ONE</div>
      <h1>Festival Crew</h1>
    </div>
    <span class="badge">PWA</span>
  </header>

  <main class="shell">
    <section id="home" class="view active">
      <div class="hero card">
        <div>
          <p class="eyebrow">Gemeinsam planen</p>
          <h2>Alles für euren Airbeat an einem Ort.</h2>
          <p class="muted">Packliste, Timetable und Crew-Notizen – direkt auf dem Handy.</p>
        </div>
      </div>

      <div class="grid">
        <button class="tile" data-open="packliste">
          <span class="icon">🎒</span>
          <strong>Packliste</strong>
          <small>Abhaken & ergänzen</small>
        </button>
        <button class="tile" data-open="timetable">
          <span class="icon">🗓️</span>
          <strong>Timetable</strong>
          <small>Acts & Zeiten planen</small>
        </button>
        <button class="tile" data-open="crew">
          <span class="icon">👥</span>
          <strong>Crew</strong>
          <small>Notizen & Treffpunkte</small>
        </button>
      </div>
    </section>

    <section id="packliste" class="view">
      <div class="section-head">
        <div>
          <p class="eyebrow">Vorbereitung</p>
          <h2>Packliste</h2>
        </div>
        <button class="ghost" data-reset="packing">Zurücksetzen</button>
      </div>

      <div class="card">
        <form id="packForm" class="add-row">
          <input id="packInput" placeholder="Neuen Gegenstand hinzufügen" autocomplete="off">
          <button>+</button>
        </form>
        <div id="packingList" class="list"></div>
      </div>
    </section>

    <section id="timetable" class="view">
      <div class="section-head">
        <div>
          <p class="eyebrow">Festivalplan</p>
          <h2>Timetable</h2>
        </div>
      </div>

      <div class="card">
        <form id="timeForm" class="time-form">
          <input id="timeDay" placeholder="Tag, z. B. Freitag" required>
          <input id="timeHour" type="time" required>
          <input id="timeAct" placeholder="Act / Treffpunkt" required>
          <button>Hinzufügen</button>
        </form>
        <div id="timeline" class="timeline"></div>
      </div>
    </section>

    <section id="crew" class="view">
      <div class="section-head">
        <div>
          <p class="eyebrow">Gruppe</p>
          <h2>Crew & Notizen</h2>
        </div>
      </div>
      <div class="card">
        <label class="field">
          <span>Treffpunkt</span>
          <input id="meetingPoint" placeholder="z. B. Camp Eingang Nord">
        </label>
        <label class="field">
          <span>Gemeinsame Notizen</span>
          <textarea id="crewNotes" rows="8" placeholder="Fahrgemeinschaft, Einkauf, wichtige Infos ..."></textarea>
        </label>
        <p class="muted small">Diese Daten werden aktuell nur auf diesem Gerät gespeichert.</p>
      </div>
    </section>
  </main>

  <nav class="bottomnav">
    <button class="navbtn active" data-open="home">🏠<span>Start</span></button>
    <button class="navbtn" data-open="packliste">🎒<span>Packliste</span></button>
    <button class="navbtn" data-open="timetable">🗓️<span>Timetable</span></button>
    <button class="navbtn" data-open="crew">👥<span>Crew</span></button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
